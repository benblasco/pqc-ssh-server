---
# Forgejo Actions workflow YAML (see .pre-commit-config.yaml).
extends: default

rules:
  document-start: disable
  line-length:
    max: 120
    # Long run: blocks in Forgejo workflow; actionlint still lints the file.
    ignore: |
      .forgejo/workflows/container-build.yml
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
